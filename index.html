<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ADA CEZVEM — QR Menü</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg-dark: #120c09;
    --bg-card: #1c130d;
    --bg-card-hover: #261a12;
    --gold: #d4af37;
    --gold-light: #f3e5ab;
    --gold-dark: #aa820a;
    --espresso: #2b1810;
    --text-main: #f0e6df;
    --text-muted: #a69285;
    --cream: #f7f3ee;
    --border-color: rgba(212, 175, 55, 0.2);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% 20%, rgba(43, 24, 16, 0.5) 0%, rgba(18, 12, 9, 0.95) 100%);
    z-index: -1;
  }

  /* HEADER & BRANDING */
  header {
    width: 100%;
    max-width: 600px;
    padding: 2.5rem 1.5rem 1.5rem 1.5rem;
    text-align: center;
    position: relative;
  }

  .logo-container {
    display: inline-block;
    position: relative;
    margin-bottom: 0.8rem;
  }

  .logo-icon {
    font-size: 2.8rem;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .brand-title {
    font-family: 'Cinzel', serif;
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, #fff 0%, var(--gold-light) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    margin-bottom: 0.2rem;
  }

  .brand-subtitle {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.85;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 1.2rem auto;
  }

  /* CATEGORY NAV (STICKY BAR) */
  .nav-container {
    width: 100%;
    max-width: 600px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(18, 12, 9, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    padding: 0.8rem 0;
  }

  .nav-scroll {
    display: flex;
    overflow-x: auto;
    padding: 0 1.2rem;
    gap: 0.6rem;
    scrollbar-width: none;
  }

  .nav-scroll::-webkit-scrollbar {
    display: none;
  }

  .nav-btn {
    background: rgba(43, 24, 16, 0.6);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    padding: 0.6rem 1.2rem;
    border-radius: 25px;
    font-size: 0.8rem;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .nav-btn.active {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: var(--espresso);
    border-color: var(--gold-light);
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
  }

  /* MAIN CONTAINER */
  main {
    width: 100%;
    max-width: 600px;
    padding: 1.5rem 1.2rem 4rem 1.2rem;
    flex: 1;
  }

  .category-section {
    margin-bottom: 2.5rem;
  }

  .category-header {
    font-family: 'Cinzel', serif;
    font-size: 1.3rem;
    color: var(--gold-light);
    margin-bottom: 1.2rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px dashed var(--border-color);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .item-row {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: transform 0.2s ease, border-color 0.2s ease;
    cursor: pointer;
  }

  .item-row:active {
    transform: scale(0.98);
    background: var(--bg-card-hover);
  }

  .item-img-wrap {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    overflow: hidden;
    background: rgba(0,0,0,0.3);
    margin-right: 1rem;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(212, 175, 55, 0.1);
  }

  .item-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .item-emoji {
    font-size: 1.8rem;
  }

  .item-info {
    flex: 1;
    padding-right: 0.8rem;
  }

  .item-name {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--cream);
    margin-bottom: 0.2rem;
  }

  .item-desc {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.3;
  }

  .item-price {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--gold);
    white-space: nowrap;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: var(--bg-card);
    border: 1px solid var(--gold);
    border-radius: 16px;
    width: 100%;
    max-width: 400px;
    padding: 1.5rem;
    text-align: center;
    transform: translateY(20px);
    transition: transform 0.3s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .modal-overlay.active .modal-card {
    transform: translateY(0);
  }

  .modal-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 1rem;
    border: 1px solid var(--border-color);
  }

  .modal-title {
    font-family: 'Cinzel', serif;
    font-size: 1.3rem;
    color: var(--gold-light);
    margin-bottom: 0.5rem;
  }

  .modal-price {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 1rem;
  }

  .modal-close {
    background: var(--gold);
    color: var(--espresso);
    border: none;
    padding: 0.7rem 2rem;
    border-radius: 25px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 0.9rem;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--text-muted);
    font-size: 0.75rem;
    border-top: 1px solid var(--border-color);
    width: 100%;
    max-width: 600px;
  }

  footer a {
    color: var(--gold);
    text-decoration: none;
  }

  /* Intensity Badges */
  .intensity-wrap {
    display: flex;
    gap: 0.4rem;
    margin-top: 0.3rem;
    flex-wrap: wrap;
  }

  .intensity-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    padding: 0.15rem 0.45rem;
    border-radius: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #fff;
  }
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <div class="logo-icon">☕</div>
  </div>
  <h1 class="brand-title">Ada Cezvem</h1>
  <div class="brand-subtitle">Geleneksel & Modern Lezzetler</div>
  <div class="divider"></div>
</header>

<div class="nav-container">
  <div class="nav-scroll" id="navScroll"></div>
</div>

<main id="mainContent"></main>

<!-- MODAL -->
<div class="modal-overlay" id="itemModal" onclick="closeModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div id="modalMedia"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-price" id="modalPrice"></div>
    <button class="modal-close" onclick="closeModalDirect()">Kapat</button>
  </div>
</div>

<footer>
  <p>© 2026 Ada Cezvem. Tüm Hakları Saklıdır.</p>
</footer>

<script>
const ITEM_EMOJI = {
  'turk-kahvesi': '☕',
  'dibek-kahvesi': '☕',
  'menengic': '☕',
  'damla-sakizli': '☕',
  'espresso': '☕',
  'americano': '☕',
  'latte': '🥛',
  'cappuccino': '☕',
  'flat-white': '☕',
  'cortado': '☕',
  'macchiato': '☕',
  'mocha': '🍫',
  'white-mocha': '🍫',
  'affogato': '🍨',
  'filtre-kahve': '☕',
  'ice-americano': '🧊',
  'ice-latte': '🧊',
  'ice-mocha': '🧊',
  'ice-white-mocha': '🧊',
  'cold-brew': '🧊',
  'frappe': '🥤',
  'demleme-cay': '🫖',
  'bitki-caylari': '🌿',
  'salep': '☕',
  'sicak-cikolata': '🍫',
  'limonata': '🍋',
  'churchill': '🧂',
  'soda': '🫧',
  'meyveli-soda': '🍓',
  'su': '💧',
  'san-sebastian': '🍰',
  'magnolia': '🍌',
  'tiramisu': '🍰',
  'waffle': '🧇',
  'brownie': '🍫',
  'fondue': '🍓'
};

function escQ(str) {
  return (str || '').replace(/'/g, "\\'");
}

let menuData = null;

async function loadMenu() {
  try {
    const res = await fetch('menu.json');
    menuData = await res.json();
    renderNav(menuData);
    renderSections(menuData);
  } catch (err) {
    console.error("Menu yüklenirken hata oluştu:", err);
  }
}

function renderNav(data) {
  const nav = id('navScroll');
  let html = '';
  data.categories.forEach((cat, index) => {
    const activeClass = index === 0 ? 'active' : '';
    html += `<button class="nav-btn ${activeClass}" onclick="scrollToCategory('${cat.id}', this)">
      <span>${cat.icon || '☕'}</span> ${cat.title}
    </button>`;
  });
  nav.innerHTML = html;
}

function renderSections(data) {
  const main = id('mainContent');
  let html = '';
  data.categories.forEach(cat => {
    html += `<section class="category-section" id="cat-${cat.id}">
      <div class="category-header">
        <span>${cat.icon || '☕'}</span>
        <h2>${cat.title}</h2>
      </div>`;

    cat.items.forEach(item => {
      const em = ITEM_EMOJI[item.id] || '';
      const badgeHtml = item.badge ? `<span style="display:inline-block;font-family:'Cinzel',serif;font-size:0.52rem;letter-spacing:0.15em;color:var(--espresso);background:var(--gold);padding:0.1rem 0.45rem;border-radius:20px;margin-left:0.4rem;vertical-align:middle">${item.badge}</span>` : '';
      const descHtml = item.desc ? `<div class="item-desc">${item.desc}</div>` : '';

      let intensityHtml = '';
      if (item.intensity) {
        intensityHtml += '<div class="intensity-wrap">';
        Object.keys(item.intensity).forEach(key => {
          const opt = item.intensity[key];
          intensityHtml += `
            <span class="intensity-badge" style="background-color: ${opt.color || '#8B5A35'};">
              ${opt.name}
            </span>
          `;
        });
        intensityHtml += '</div>';
      }

      html += `
        <div class="item-row" onclick="openModal('${escQ(item.name)}','${item.price}','${escQ(item.image)}','${em}')">
          <div class="item-img-wrap">
            <img src="${escQ(item.image)}" onerror="this.style.display='none'" />
            <span class="item-emoji">${em}</span>
          </div>
          <div class="item-info">
            <div class="item-name">${item.name}${badgeHtml}</div>
            ${descHtml}
            ${intensityHtml}
          </div>
          <div class="item-price">₺ ${item.price}</div>
        </div>
      `;
    });

    html += `</section>`;
  });
  main.innerHTML = html;
}

function scrollToCategory(id, btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const target = document.getElementById('cat-' + id);
  if (target) {
    const yOffset = -70; 
    const y = target.getBoundingClientRect().top + window.pageYOffset + yOffset;
    window.scrollTo({top: y, behavior: 'smooth'});
  }
}

function openModal(name, price, img, emoji) {
  id('modalTitle').innerText = name;
  id('modalPrice').innerText = '₺ ' + price;
  
  const mediaDiv = id('modalMedia');
  if (img && img !== 'undefined') {
    mediaDiv.innerHTML = `<img src="${img}" class="modal-img" alt="${name}"/>`;
  } else {
    mediaDiv.innerHTML = `<div style="font-size: 5rem; margin-bottom: 1rem;">${emoji}</div>`;
  }

  id('itemModal').classList.add('active');
}

function closeModal(e) {
  if (e.target.id === 'itemModal') {
    closeModalDirect();
  }
}

function closeModalDirect() {
  id('itemModal').classList.remove('active');
}

function id(name) {
  return document.getElementById(name);
}

window.addEventListener('DOMContentLoaded', loadMenu);
</script>
</body>
</html>
